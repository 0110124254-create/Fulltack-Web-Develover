<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Navigation Menu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body {
      background: #1e293b; color: #f8fafc; height: 100vh; overflow: hidden;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; border-bottom: 2px solid #334155;
    }
    .menu-group { display: flex; align-items: center; gap: 10px; }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      background: #334155; color: #f1f5f9; text-decoration: none;
      font-size: 12.5px; font-weight: 600; border-radius: 6px;
      border: 1px solid #475569; transition: all 0.2s;
    }
    .nav-btn:hover, .nav-btn:active { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
    .target-tag { font-size: 11px; color: #94a3b8; font-family: monospace; }
  </style>
</head>
<body>
  <!-- Navigasi Menu Sesuai Poin 3: Home, MyStudy, Gallery -->
  <!-- Target Link Internal ke Area main_frame Sesuai Poin 5 & Ketentuan Penilaian 3 & 6 -->
  <div class="menu-group">
    <span style="font-size: 11px; text-transform: uppercase; font-weight: 700; color: #94a3b8;">Navigasi:</span>
    <a href="home.html" target="main_frame" class="nav-btn">🏠 Home (Personal Profile)</a>
    <a href="study.html" target="main_frame" class="nav-btn">🎓 MyStudy (Riwayat Pendidikan)</a>
    <a href="gallery.html" target="main_frame" class="nav-btn">📸 Gallery (Kumpulan Gambar)</a>
  </div>
  <div class="target-tag">Target Frame: <strong>target="main_frame"</strong></div>
</body>
</html>
